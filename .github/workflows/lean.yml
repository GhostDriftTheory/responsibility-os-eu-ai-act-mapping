name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Resolve dependencies
        run: lake update

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build EUAIActMapping

      - name: Verify source
        run: lake env lean -DwarningAsError=true EUAIActMapping.lean
